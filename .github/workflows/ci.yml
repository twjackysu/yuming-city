name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.loop/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build:
    name: 測試與匯出
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 只下載正式角色模型（概念圖等其他 LFS 檔不需要進遊戲）；沒有模型時什麼都不做
      - name: 下載角色模型（Git LFS）
        run: git lfs pull --include="art-inbox/characters/**" || echo "沒有角色模型或 LFS 下載失敗，用程序人偶"

      - name: Cache Godot 與 export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yuming-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/get-godot.sh') }}

      - name: Cache 素材來源（Noto CJK）
        uses: actions/cache@v4
        with:
          path: ~/.cache/yuming-assets
          key: assets-${{ hashFiles('scripts/gen_fonts.py') }}

      - name: Import、測試、匯出
        run: scripts/check.sh --export

      - name: 截圖（軟體 Vulkan）
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          scripts/screenshot.sh build/title.png 30
          scripts/screenshot.sh build/town.png 120 --level=frostbridge --perf || true
          scripts/screenshot.sh build/dialogue.png 150 --level=frostbridge --dialogue=slice_pear_seller --dialogue-steps=2 --locale=zh_TW || true
          scripts/screenshot.sh build/bell.png 120 --level=frostbridge --cutscene=slice_bell_nine --cutscene-steps=3 --locale=zh_TW || true
          scripts/screenshot.sh build/combat.png 24 --level=frostbridge --convoy --insight --pos=2.2,9.5 --face=undertaker --face-off=18 --locale=zh_TW || true
          scripts/screenshot.sh build/ninebreath.png 24 --level=frostbridge --convoy --throw=arch --throw-t=0.8 --pos=2.6,10.5 --face=arch --face-off=14 --locale=zh_TW || true
          scripts/screenshot.sh build/street.png 40 --level=frostbridge --at=main --quality=2 --nohud --locale=zh_TW || true

      # Steam 膠囊圖替代版（D-064）：主街夜景＋標題字，正式主視覺做好前先給商店頁用
      - name: Steam 膠囊圖替代版
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user --break-system-packages "pillow==11.3.0" || python3 -m pip install --quiet --user "pillow==11.3.0"
          [[ -s build/street.png ]] && python3 -P scripts/steam_mock.py build/street.png build/steam --title-shot build/title.png
          # 成就圖示替代版（D-147）：每個成就 256×256 解鎖／未解鎖各一張，打包成 zip 給 Steamworks 批次上傳
          python3 -P scripts/achievement_icons.py build/steam/achievements

      # 匯出版本身（不是編輯器）能開到霜橋鎮、畫出東西、沒有 SCRIPT ERROR（M1.4）
      - name: 匯出版 smoke test
        run: |
          command -v xvfb-run > /dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null; }
          scripts/smoke_export.sh build/linux/YumingCity.x86_64 build/smoke-export.png

      - name: 打包
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          # Windows 實機拍 Steam 商店截圖的腳本與清單一起放進 zip（D-145）；runner 有 pwsh 就先檢查語法
          cp scripts/store-shots.ps1 scripts/store_shots.txt build/windows/
          if command -v pwsh > /dev/null; then
            pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("build/windows/store-shots.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }; Write-Host "store-shots.ps1 語法 OK"'
          fi
          cd build
          python3 -c "import shutil; shutil.make_archive('YumingCity-windows-x64-$SHORT_SHA', 'zip', 'windows')"
          python3 -c "import shutil; shutil.make_archive('YumingCity-linux-x64-$SHORT_SHA', 'zip', 'linux')"
          ls -la

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuming-city-${{ env.SHORT_SHA }}
          path: |
            build/*.zip
            build/title.png
            build/town.png
            build/dialogue.png
            build/bell.png
            build/combat.png
            build/ninebreath.png
            build/street.png
            build/steam/*.png
            build/steam/achievements/achievement-icons.zip
            build/steam/achievements/achievements_sheet.png
            build/smoke-export.png
            build/smoke-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: 更新 prerelease「latest」
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=(build/*.zip)
          [[ -s build/title.png ]] && FILES+=(build/title.png)
          [[ -s build/town.png ]] && FILES+=(build/town.png)
          [[ -s build/dialogue.png ]] && FILES+=(build/dialogue.png)
          [[ -s build/bell.png ]] && FILES+=(build/bell.png)
          [[ -s build/combat.png ]] && FILES+=(build/combat.png)
          [[ -s build/ninebreath.png ]] && FILES+=(build/ninebreath.png)
          [[ -s build/steam/header_capsule.png ]] && FILES+=(build/steam/header_capsule.png)
          [[ -s build/steam/achievements/achievement-icons.zip ]] && FILES+=(build/steam/achievements/achievement-icons.zip)
          [[ -s build/steam/achievements/achievements_sheet.png ]] && FILES+=(build/steam/achievements/achievements_sheet.png)
          # main 上已經有更新的程式 commit 時跳過（下一個 run 會發布），不刪舊版。
          # 這種情況下用 GITHUB_TOKEN 在舊 commit 建 tag，若 workflow 檔已改過會被 403 擋（run 42398212944、42402903825）。
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':!docs' ':!.loop' ':!*.md'; then
            echo "main 已有更新的程式 commit，跳過發布 latest"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          for attempt in 1 2 3; do
            if gh release create latest "${FILES[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "最新開發版 / Latest dev build (${SHORT_SHA})" \
              --notes "main 分支 ${SHORT_SHA} 自動建置。Windows：解壓後執行 YumingCity.exe。原型版本，非最終內容。 / Automated build from main ${SHORT_SHA}. Prototype, not final content."; then
              exit 0
            fi
            echo "建立 release 失敗（第 $attempt 次），20 秒後重試" >&2
            gh release delete latest --yes --cleanup-tag || true
            sleep 20
          done
          exit 1

  # 盤點截圖（D-082）：跟「測試與匯出」平行跑，把 Jacky 與 loop 想看的每個主要畫面各拍一張，
  # 發布到 prerelease「screens」（loop 的雲端 session 不一定能在本機跑 Godot 截圖，也連不到
  # artifact 的儲存空間，release 下載是唯一看得到畫面的地方）。失敗不影響 CI 結果。
  screens:
    name: 盤點截圖
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 下載角色模型（Git LFS）
        run: git lfs pull --include="art-inbox/characters/**" || echo "沒有角色模型或 LFS 下載失敗，用程序人偶"

      - name: Cache Godot 與 export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yuming-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/get-godot.sh') }}

      - name: Cache 素材來源（Noto CJK）
        uses: actions/cache@v4
        with:
          path: ~/.cache/yuming-assets
          key: assets-${{ hashFiles('scripts/gen_fonts.py') }}

      - name: 產生素材與 import
        run: |
          GODOT="$(scripts/get-godot.sh)"
          scripts/gen-assets.sh
          "$GODOT" --headless --path game --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path game --import > /dev/null 2>&1

      - name: 截圖（軟體 Vulkan）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          mkdir -p build/screens
          shot() {
            local name="$1" frames="$2"
            shift 2
            scripts/screenshot.sh "build/screens/$name.png" "$frames" "$@" > /dev/null 2>&1 || echo "截圖 $name 失敗"
          }
          shot 01-settings 30 --open=settings --locale=zh_TW
          shot 02-pause 40 --level=frostbridge --open=pause --locale=zh_TW
          shot 03-plaza 40 --level=frostbridge --at=plaza --locale=zh_TW
          shot 04-stall 40 --level=frostbridge --pos=3.0,3.2 --locale=zh_TW
          shot 05-steps 40 --level=frostbridge --at=steps --locale=zh_TW
          shot 06-rescue 40 --level=frostbridge --rescue --locale=zh_TW
          shot 07-convoy-fight 40 --level=frostbridge --convoy --phase2 --face=undertaker --locale=zh_TW
          shot 08-arch-preview 40 --level=frostbridge --convoy --arch=preview --locale=zh_TW
          shot 09-journal 40 --level=frostbridge --open=journal --locale=zh_TW
          shot 10-plaza-en 40 --level=frostbridge --at=plaza --locale=en
          shot 11-convoy-insight 24 --level=frostbridge --convoy --insight --pos=2.2,9.5 --face=undertaker --face-off=18 --locale=zh_TW
          shot 12-ch1-tavern 30 --level=tavern --ch1-stage=dinner --locale=zh_TW
          shot 13-ch1-day-north 30 --level=frostbridge --day --at=north --locale=zh_TW
          shot 14-ch1-stairs 30 --level=stairs --stairs-at=trap --locale=zh_TW
          shot 15-ch1-daylight 30 --level=daylight --daylight-at=stele --locale=zh_TW
          shot 16-ch1-dinner 30 --level=daylight --daylight-at=dinner --locale=zh_TW
          shot 17-ch1-bell-yard-road 30 --level=daylight --daylight-at=yard --locale=zh_TW
          shot 18-ch2-table 30 --level=bell_hall --hall-at=table --locale=zh_TW
          shot 19-ch2-hall 30 --level=bell_hall --locale=zh_TW
          shot 20-ch2-isa-insight 30 --level=bell_hall --hall-at=seated --hall-insight=1.6 --locale=zh_TW
          shot 21-ch2-inner 30 --level=bell_hall --hall-at=inner --locale=zh_TW
          shot 22-ch2-inner-after 30 --level=bell_hall --hall-at=leo --locale=zh_TW
          shot 23-ch2-carvings 30 --level=bell_hall --hall-at=carved --locale=zh_TW
          shot 24-ch2-eye 22 --level=bell_hall --hall-at=eye --hall-shot=3 --locale=zh_TW
          shot 25-ch2-eye-after 30 --level=bell_hall --hall-at=eye-after --locale=zh_TW
          ls -la build/screens
          test -n "$(ls build/screens/*.png 2>/dev/null)"
          cd build && python3 -c "import shutil; shutil.make_archive('screens', 'zip', 'screens')"

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.sha }}
          path: build/screens/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: 更新 prerelease「screens」
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':!docs' ':!.loop' ':!*.md'; then
            echo "main 已有更新的程式 commit，跳過發布 screens"
            exit 0
          fi
          gh release delete screens --yes --cleanup-tag || true
          gh release create screens build/screens.zip build/screens/*.png \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "盤點截圖 / Screen check (${SHORT_SHA})" \
            --notes "開發用：每次 main 建置自動拍的主要畫面（設定、暫停、廣場、攤子、石階、救援、送葬者戰、石拱預覽、日記、英文版廣場、送葬者戰看穿）。試玩請下載 latest。 / Dev-only screenshots of key screens from main ${SHORT_SHA}. Download the game from the 'latest' release."
