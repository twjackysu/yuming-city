name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.loop/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build:
    name: 測試與匯出
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 只下載正式角色模型（概念圖等其他 LFS 檔不需要進遊戲）；沒有模型時什麼都不做
      - name: 下載角色模型（Git LFS）
        run: git lfs pull --include="art-inbox/characters/**" || echo "沒有角色模型或 LFS 下載失敗，用程序人偶"

      # 自製角色模型（scripts/gen_art.sh，D-249）：bpy 5.3.0 的 wheel 只有 Python 3.13；不改 PATH，只把路徑交給 gen_art.sh
      - name: Python 3.13（bpy 用）
        id: py313
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: false

      - name: Cache Godot 與 export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yuming-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/get-godot.sh') }}

      - name: Cache 素材來源（Noto CJK）
        uses: actions/cache@v4
        with:
          path: ~/.cache/yuming-assets
          key: assets-${{ hashFiles('scripts/gen_fonts.py') }}

      - name: Import、測試、匯出
        env:
          ART_PYTHON: ${{ steps.py313.outputs.python-path }}
        run: scripts/check.sh --export

      - name: 截圖（軟體 Vulkan）
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          scripts/screenshot.sh build/title.png 30
          # 這一張是這個 job 第一次開關卡：軟體 Vulkan 要先編 shader，常常超過 screenshot.sh 的 120 秒逾時。
          # 不要用減少幀數來「修」：第 79 輪改成 40 幀，結果 Vulkan 照樣逾時、退回 OpenGL 拍出一張沒有體積霧的圖發布出去。
          scripts/screenshot.sh build/forest.png 120 --level=corrupt_forest --locale=zh_TW || true

      # 匯出版本身（不是編輯器）能開到腐敗之森、畫出東西、沒有 SCRIPT ERROR（M1.4）
      - name: 匯出版 smoke test
        run: |
          command -v xvfb-run > /dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null; }
          scripts/smoke_export.sh build/linux/YumingCity.x86_64 build/smoke-export.png

      - name: 打包
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cd build
          python3 -c "import shutil; shutil.make_archive('YumingCity-windows-x64-$SHORT_SHA', 'zip', 'windows')"
          python3 -c "import shutil; shutil.make_archive('YumingCity-linux-x64-$SHORT_SHA', 'zip', 'linux')"
          ls -la

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuming-city-${{ env.SHORT_SHA }}
          path: |
            build/*.zip
            build/title.png
            build/town.png
            build/dialogue.png
            build/smoke-export.png
            build/smoke-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: 更新 prerelease「latest」
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=(build/*.zip)
          [[ -s build/title.png ]] && FILES+=(build/title.png)
          [[ -s build/town.png ]] && FILES+=(build/town.png)
          [[ -s build/dialogue.png ]] && FILES+=(build/dialogue.png)
          # main 上已經有更新的程式 commit 時跳過（下一個 run 會發布），不刪舊版。
          # 這種情況下用 GITHUB_TOKEN 在舊 commit 建 tag，若 workflow 檔已改過會被 403 擋（run 42398212944、42402903825）。
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':!docs' ':!.loop' ':!*.md'; then
            echo "main 已有更新的程式 commit，跳過發布 latest"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          for attempt in 1 2 3; do
            if gh release create latest "${FILES[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "最新開發版 / Latest dev build (${SHORT_SHA})" \
              --notes "main 分支 ${SHORT_SHA} 自動建置。Windows：解壓後執行 YumingCity.exe。原型版本，非最終內容。 / Automated build from main ${SHORT_SHA}. Prototype, not final content."; then
              exit 0
            fi
            echo "建立 release 失敗（第 $attempt 次），20 秒後重試" >&2
            gh release delete latest --yes --cleanup-tag || true
            sleep 20
          done
          exit 1

  # 盤點截圖（D-082）：跟「測試與匯出」平行跑，把 Jacky 與 loop 想看的每個主要畫面各拍一張，
  # 發布到 prerelease「screens」（loop 的雲端 session 不一定能在本機跑 Godot 截圖，也連不到
  # artifact 的儲存空間，release 下載是唯一看得到畫面的地方）。失敗不影響 CI 結果。
  screens:
    name: 盤點截圖
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 下載角色模型（Git LFS）
        run: git lfs pull --include="art-inbox/characters/**" || echo "沒有角色模型或 LFS 下載失敗，用程序人偶"

      # 自製角色模型（scripts/gen_art.sh，D-249）：bpy 5.3.0 的 wheel 只有 Python 3.13；不改 PATH，只把路徑交給 gen_art.sh
      - name: Python 3.13（bpy 用）
        id: py313
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: false

      - name: Cache Godot 與 export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yuming-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/get-godot.sh') }}

      - name: Cache 素材來源（Noto CJK）
        uses: actions/cache@v4
        with:
          path: ~/.cache/yuming-assets
          key: assets-${{ hashFiles('scripts/gen_fonts.py') }}

      - name: 產生素材與 import
        env:
          ART_PYTHON: ${{ steps.py313.outputs.python-path }}
        run: |
          GODOT="$(scripts/get-godot.sh)"
          scripts/gen-assets.sh
          "$GODOT" --headless --path game --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path game --import > /dev/null 2>&1

      - name: 截圖（軟體 Vulkan）
        run: |
          # 這個 job 一開始就裝套件，連續三次（第 81、82 輪）遇到 runner 解析不到 azure.archive.ubuntu.com、一張圖都沒拍：重試
          for i in 1 2 3 4; do
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null && break
            echo "apt 第 $i 次失敗，30 秒後重試"
            sleep 30
          done
          command -v xvfb-run > /dev/null
          mkdir -p build/screens
          shot() {
            local name="$1" frames="$2"
            shift 2
            scripts/screenshot.sh "build/screens/$name.png" "$frames" "$@" > /dev/null 2>&1 || echo "截圖 $name 失敗"
          }
          shot 01-settings 30 --open=settings --locale=zh_TW
          shot 02-pause 40 --level=corrupt_forest --open=pause --locale=zh_TW
          # 跟 scripts/shots/forest.txt 同一組：玩家的鏡頭／諾恩側面／諾恩正面／英文
          shot 10-forest-view 60 --level=corrupt_forest --locale=zh_TW
          shot 11-forest-noen-side 60 --level=corrupt_forest --cam-yaw=90 --locale=zh_TW
          shot 12-forest-noen-front 60 --level=corrupt_forest --cam-yaw=180 --locale=zh_TW
          shot 13-forest-en 60 --level=corrupt_forest --locale=en
          ls -la build/screens
          test -n "$(ls build/screens/*.png 2>/dev/null)"
          cd build && python3 -c "import shutil; shutil.make_archive('screens', 'zip', 'screens')"

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.sha }}
          path: build/screens/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: 更新 prerelease「screens」
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':!docs' ':!.loop' ':!*.md'; then
            echo "main 已有更新的程式 commit，跳過發布 screens"
            exit 0
          fi
          gh release delete screens --yes --cleanup-tag || true
          gh release create screens build/screens.zip build/screens/*.png \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "盤點截圖 / Screen check (${SHORT_SHA})" \
            --notes "開發用：每次 main 建置自動拍的主要畫面（標題、設定、腐敗之森入口的幾個固定鏡頭）。"
